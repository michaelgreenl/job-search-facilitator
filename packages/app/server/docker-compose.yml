name: job-search-facilitator

services:
    postgres:
        image: postgres:16
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-job_search_facilitator}
            POSTGRES_USER: ${POSTGRES_USER:-job_search}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password}
        ports:
            - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
            interval: 10s
            timeout: 5s
            retries: 5

    server:
        build:
            context: ../../..
            dockerfile: packages/app/server/Dockerfile
        environment:
            PORT: 3000
            CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:5173}
            DATABASE_URL: postgresql://${POSTGRES_USER:-job_search}:${POSTGRES_PASSWORD:-local_dev_password}@postgres:5432/${POSTGRES_DB:-job_search_facilitator}
            AGENT_CONTEXT_DIRECTORY: /app/docs/agents/job-search
        ports:
            - '127.0.0.1:${PORT:-3000}:3000'
        volumes:
            - ../../../docs/agents:/app/docs/agents
        depends_on:
            postgres:
                condition: service_healthy
        healthcheck:
            test:
                [
                    'CMD',
                    'node',
                    '-e',
                    "fetch('http://127.0.0.1:3000/health').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
                ]
            interval: 5s
            timeout: 3s
            retries: 10
            start_period: 5s

volumes:
    postgres_data:
