services:
    postgres:
        image: postgres:16
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-job_search_facilitator}
            POSTGRES_USER: ${POSTGRES_USER:-job_search}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password}
        ports:
            - '${POSTGRES_PORT:-5432}:5432'
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
            interval: 10s
            timeout: 5s
            retries: 5

volumes:
    postgres_data:
