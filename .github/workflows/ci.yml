name: CI

on:
    pull_request:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    checks:
        name: Static checks, tests, and builds
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_DB: job_search_facilitator_test
                    POSTGRES_USER: job_search
                    POSTGRES_PASSWORD: local_dev_password
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U job_search -d job_search_facilitator_test"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        env:
            HUSKY: 0
            TEST_DATABASE_URL: postgresql://job_search:local_dev_password@localhost:5432/job_search_facilitator_test
        steps:
            - name: Checkout
              uses: actions/checkout@v6
              with:
                  persist-credentials: false

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  run_install: false

            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version: 24.x
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run checks
              run: pnpm run check

            - name: Run integration tests
              run: pnpm run test:integration
